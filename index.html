function applyRec(rec){
 if(!rec||G.state!=='idle'){if(rec)pendingRec=rec;return}
 pendingRec=null;
 G.save.max=rec.max;G.save.rounds=rec.rounds;G.save.shots=rec.shots;
 try{localStorage.setItem(SAVEK,JSON.stringify(G.save))}catch(_){}
 if(G.lv>G.save.max)GAME.setLevel(G.save.max);
}
function persistSess(){ST.sess=sess;store()}
async function startSession(){
 if(starting||!ident)return;starting=true;
 const body={id:ident.id,name:ident.name};if(ident.auth)body.auth=ident.auth;
 const r=await api('/start',body);starting=false;
 if(r.st===200&&r.j.token){
  failN=0;lastErr='';
  sess={id:ident.id,token:r.j.token,seeds:r.j.seeds,sc:r.j.sc,used:0,log:[],quiet:!!r.j.quiet,at:Date.now()};persistSess();
  if(r.j.rec)applyRec(r.j.rec);
  return;
 }
 sess=null;
 if(r.st===403||r.st===401){lastErr='denied';return}
 if(r.st===400&&ident.id[0]==='g'){ST.name=null;store();ident.name=await askName();ST.name=ident.name;store();return startSession()}
 failN++;lastErr='net';sched(Math.min(300000,15000*failN));
}
function sched(ms){clearTimeout(tRetry);tRetry=setTimeout(()=>{if(!sess)startSession();else sync()},ms)}
async function sync(keepalive){
 if(!sess||!sess.log.length||busy)return;busy=true;clearTimeout(tIdle);
 const n=Math.min(sess.log.length,300),body={token:sess.token,shots:sess.log.slice(0,n)};if(ident.auth)body.auth=ident.auth;
 const r=await api('/sync',body,keepalive);busy=false;
 if(!sess)return;
 if(r.st===200&&!r.j.quiet){
  failN=0;lastErr='';
  const abs=sess.sc+sess.used;sess.log.splice(0,n);
  sess.token=r.j.token;sess.seeds=r.j.seeds;sess.sc=r.j.sc;sess.used=Math.max(0,abs-r.j.sc);sess.quiet=false;sess.at=Date.now();persistSess();
  if(!sess.log.length)applyRec(r.j.rec);else sync();
  return;
 }
 if(r.st===200&&r.j.quiet){lastErr='quiet';sched(300000);return}
 if(r.st===429){sched(((r.j.wait||30)+2)*1000);return}
 if(r.st===0||r.st>=500){failN++;lastErr='net';sched(Math.min(300000,20000*failN));return}
 // 401/403/404/409/422: de server wint; log weg en opnieuw starten
 try{const a=JSON.parse(localStorage.getItem('voetbalbe_shootout_log')||'[]');a.push({t:new Date().toISOString().slice(0,19),ev:'sync geweigerd',st:r.st,x:String(r.j.error||'')});while(a.length>25)a.shift();localStorage.setItem('voetbalbe_shootout_log',JSON.stringify(a))}catch(_){}
 sess=null;ST.sess=null;store();startSession();
}
function afterShotSchedule(){clearTimeout(tIdle);tIdle=setTimeout(()=>sync(),45000)}

window.VBNET={
 // vlak voor een schot: seed van de Worker, of oefenmodus (geen seed beschikbaar → niets bewaard, niets vrijgespeeld)
 before(lv,aim,power,curl,jit){
  if(!sess||sess.used>=sess.seeds.length)return{practice:true,rng:null};
  const k=sess.sc+sess.used,seed=sess.seeds[sess.used++];persistSess();
  return{practice:false,rng:Phys.seeded(seed),meta:{lv:lv,k:k,gx:aim.gx,gy:aim.gy,p:power,c:curl,j:jit}};
 },
 after(sh,goal){
  if(!sh||sh.practice||!sess)return;
  sess.log.push({...sh.meta,g:!!goal});persistSess();
  if(sess.log.length>=100)sync();else afterShotSchedule();
 },
 notice(){
  if(!ident)return'';
  if(lastErr==='denied')return'Oefenmodus · niet opgeslagen';
  if(!sess)return'Verbinden…';
  if(sess.used>=sess.seeds.length)return'Oefenmodus · niet opgeslagen';
  if(lastErr==='quiet')return'Server druk · opslag later';
  if(lastErr==='net'&&sess.log.length)return'Offline · wordt later bewaard';
  return'';
 },
 name(){return ident&&ident.name},

  const rows=r.j.top.map((e,i)=>{const own=ident&&e.n===ident.name&&e.m===G.save.max&&e.r===G.save.rounds;
   return'<div style="display:flex;gap:8px;padding:6px 4px;border-radius:8px;'+(own?'background:rgba(255,225,77,.2);':'')+'"><span style="width:28px;opacity:.7">'+(i+1)+'</span><span class="n" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><span style="white-space:nowrap">'+(e.r?e.r+'× · ':'')+'lvl '+e.m+'</span></div>'}).join('');
  box.innerHTML=(rows||'<div>Nog niemand in het klassement.</div>')+'<div style="opacity:.6;font-size:12px;margin-top:8px">'+r.j.n+' spelers · wordt elk uur bijgewerkt</div>';
  const names=box.querySelectorAll('.n');r.j.top.forEach((e,i)=>{if(names[i])names[i].textContent=e.n});
 },

};

function figure(c,x,y,s,ang,arms,pal,wall){
 c.save();c.translate(x,y);c.rotate(ang);c.lineCap='round';c.lineJoin='round';
 const ol=Math.max(1.2,s*.03);c.strokeStyle=pal.line;c.lineWidth=ol;
 const R=GAME.rr;
 for(const sx of[-1,1]){
  c.fillStyle=pal.sock;R(c,sx*.1*s-.075*s,.36*s,.15*s,.55*s,.05*s);c.fill();c.stroke();
  c.fillStyle=pal.boot;c.beginPath();c.ellipse(sx*.1*s+sx*.02*s,.94*s,.1*s,.05*s,0,0,7);c.fill();
 }
 c.fillStyle=pal.shorts;R(c,-.23*s,-.04*s,.46*s,.44*s,.08*s);c.fill();c.stroke();
 for(const sx of[-1,1]){
  const hx=wall?sx*.1*s:GAME.lerp(sx*.56*s,sx*.14*s,arms),hy=wall?.0*s:GAME.lerp(-.22*s,-1.22*s,arms);
  c.strokeStyle=pal.line;c.lineWidth=.17*s+ol*2;c.beginPath();c.moveTo(sx*.24*s,-.5*s);c.lineTo(hx,hy);c.stroke();
  c.strokeStyle=pal.shirt;c.lineWidth=.17*s;c.beginPath();c.moveTo(sx*.24*s,-.5*s);c.lineTo(hx,hy);c.stroke();
  c.fillStyle=pal.glove;c.strokeStyle=pal.line;c.lineWidth=ol;c.beginPath();c.arc(hx,hy,.1*s,0,7);c.fill();c.stroke();
 }
 c.fillStyle=pal.shirt;R(c,-.23*s,-.62*s,.46*s,.64*s,.09*s);c.fill();c.stroke();
 if(pal.stripe){c.fillStyle=pal.stripe;c.fillRect(-.23*s,-.36*s,.46*s,.08*s);}
 c.fillStyle=pal.skin;c.beginPath();c.arc(0,-.78*s,.13*s,0,7);c.fill();c.stroke();
 c.fillStyle=pal.hair;c.beginPath();c.arc(0,-.8*s,.13*s,Math.PI*1.05,Math.PI*1.95);c.fill();
 c.restore();
}
function ballVec(c,x,y,r,rot){
 const g=c.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd3da');
 c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
 c.fillStyle='#20232b';
 c.beginPath();c.arc(x+Math.sin(rot)*r*.18,y+Math.cos(rot*1.3)*r*.12,r*.28,0,7);c.fill();
 for(let i=0;i<5;i++){const a=rot+i*Math.PI*2/5,cs=Math.cos(a);if(cs>-.2){c.beginPath();c.ellipse(x+Math.sin(a)*r*.7,y+Math.sin(a*.5+i)*r*.35,r*.17*(.5+cs*.5),r*.2,a,0,7);c.fill();}}
 c.strokeStyle='#20232b';c.lineWidth=Math.max(1,r*.08);c.beginPath();c.arc(x,y,r,0,7);c.stroke();
}
