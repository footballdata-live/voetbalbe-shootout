<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden}
body{display:flex;flex-direction:column}#spelvak{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:pan-y;-webkit-user-select:none;user-select:none;border-radius:6px}
#vbbanner{flex:0 0 52px;height:52px;font-family:Roboto,system-ui,Arial,sans-serif}
.vbb-in{position:relative;display:flex;align-items:center;gap:8px;height:52px;padding:0 8px 0 10px;box-sizing:border-box;text-decoration:none;overflow:hidden;background:linear-gradient(135deg,#f4fbf4 0%,#e8f5e8 100%);border-left:4px solid #1b941b}
.vbb-ico{flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #cfe6cf;box-sizing:border-box}
.vbb-ico svg{width:15px;height:15px;stroke:#1b941b}
.vbb-tekst{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1px}
.vbb-titel{font-size:clamp(12px,3.6vw,14px);font-weight:700;line-height:1.2;color:#0a3d0a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbb-sub{font-size:clamp(10.5px,3vw,12px);line-height:1.2;color:#267326;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbb-pijl{flex:0 0 22px;width:22px;height:17px;stroke:#1b941b;animation:vbbNudge 1.8s ease-in-out infinite}
@keyframes vbbNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.vbb-pijl{animation:none}}
.vbb-pills{display:flex;gap:5px;margin-top:2px}
.vbb-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;text-decoration:none;white-space:nowrap;background:#fff;border:1.5px solid #1b941b;color:#0a3d0a}
.vbb-pill:hover{background:#1b941b;color:#fff}
.vbb-balk{position:absolute;left:0;bottom:0;height:3px;width:0;background:#1b941b}
.vbb-balk.loopt{width:100%;transition:width 15s linear}</style>
